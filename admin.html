<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baudicht Cup | Admin</title><link rel="stylesheet" href="style.css?v=restore20261126"></head><body><header><div class="brand">BAUDICHT <span>CUP</span> · ADMIN</div><p>ORGANISATION & RESULTATE</p></header><main><div id="login"><h2>Admin-Zugang</h2><p>Mit dem eingerichteten Admin-Konto anmelden.</p><input id="email" type="email" placeholder="Admin-E-Mail"><input id="pw" type="password" placeholder="Passwort"><button id="loginbtn">Einloggen</button><button id="logoutbtn" class="hidden">Abmelden</button><p id="loginmsg"></p></div><div id="admin" class="hidden"><h2>Resultate verwalten</h2><p>Resultate speichern – die Zuschauer-Seite aktualisiert sich live.</p><button id="newfixtures">Zufälligen Spielplan erstellen (4 Spiele pro Team)</button><button id="refresh">Aktualisieren</button><button id="advanceko">KO-Runden manuell aktualisieren</button><button id="resetresults" style="background:#b91c1c;color:white">Turnier-Ergebnisse zurücksetzen</button><div id="adminmatches"></div><hr><h2>Teams bearbeiten</h2><textarea id="teams" rows="8" placeholder="24 Teamnamen, je eine Zeile"></textarea><button id="saveteams">Teams speichern</button><p id="adminstatus"></p></div></main><script src="config.js?v=restore20261126"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js?v=restore20261126"></script><script src="admin.js?v=loginfix20261126"></script><script>
(function(){
const b=document.getElementById('loginbtn'),m=document.getElementById('loginmsg');
const email=document.getElementById('email'),pw=document.getElementById('pw');
function diagnostic(){if(!window.BAUDICHT_CONFIG){m.textContent='FEHLER: config.js fehlt.';return null;}if(!window.supabase){m.textContent='FEHLER: Supabase-Bibliothek wurde nicht geladen. CDN-Verbindung prüfen.';return null;}if(!window.BC||!window.BC.db){try{window.BC=window.BC||{};window.BC.db=window.supabase.createClient(window.BAUDICHT_CONFIG.SUPABASE_URL,window.BAUDICHT_CONFIG.SUPABASE_ANON_KEY);window.BC.ready=true;}catch(e){m.textContent='Client-Fehler: '+e.message;return null;}}return window.BC.db;}
b.onclick=async function(){b.disabled=true;m.textContent='Verbindung wird geprüft…';try{const db=diagnostic();if(!db)return;const {data,error}=await db.auth.signInWithPassword({email:email.value.trim(),password:pw.value});if(error){m.textContent='Login-Fehler: '+error.message;return;}if(!data.session){m.textContent='Login fehlgeschlagen: Keine Sitzung erhalten.';return;}m.textContent='Login erfolgreich. Admin-Prüfung…';if(window.BC&&window.BC.db===db){if(typeof window.BC.load==='function'){window.BC.load();}window.dispatchEvent(new Event('baudicht-login'));}if(window.adminGate){await window.adminGate();}else{m.textContent='Login erfolgreich, aber Admin-Modul konnte nicht initialisiert werden. Bitte Seite neu laden.';}}catch(e){m.textContent='Technischer Fehler: '+(e.message||String(e));}finally{b.disabled=false;}};
window.addEventListener('error',function(e){if(m&&!m.textContent)m.textContent='JavaScript-Fehler: '+(e.message||'unbekannt');});
})();
</script></body></html>
