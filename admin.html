<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baudicht Cup | Admin</title><link rel="stylesheet" href="style.css?v=teamlogos1"></head><body><header><div class="brand">BAUDICHT <span>CUP</span> · ADMIN</div><p>ORGANISATION & RESULTATE</p></header><main><div id="login"><h2>Admin-Zugang</h2><p>Mit dem eingerichteten Admin-Konto anmelden.</p><input id="email" type="email" placeholder="Admin-E-Mail"><input id="pw" type="password" placeholder="Passwort"><button id="loginbtn" type="button" onclick="if(!window.__adminLoginFallback){document.getElementById('loginmsg').textContent='Login-Skript nicht geladen. Bitte Seite neu laden.';return;}window.__adminLoginFallback()">Einloggen</button><button id="logoutbtn" class="hidden">Abmelden</button><p id="loginmsg"></p></div><div id="admin" class="hidden"><h2>Resultate verwalten</h2><p>Resultate speichern – die Zuschauer-Seite aktualisiert sich live.</p><button id="newfixtures">Zufälligen Spielplan erstellen (4 Spiele pro Team)</button><button id="refresh">Aktualisieren</button><button id="advanceko">KO-Runden manuell aktualisieren</button><button id="resetresults" style="background:#b91c1c;color:white">Turnier-Ergebnisse zurücksetzen</button><div id="adminmatches"></div><hr><h2>Teams bearbeiten</h2><textarea id="teams" rows="8" placeholder="24 Teamnamen, je eine Zeile"></textarea><button id="saveteams">Teams speichern</button><h3>Vereinslogos hochladen</h3><p>Pro Mannschaft ein Logo (PNG, JPG oder WebP).</p><div id="teamlogo-controls"></div><p id="adminstatus"></p></div></main><script src="config.js?v=20261126koFix1"></script><script>
(function(){
const msg=document.getElementById('loginmsg'),btn=document.getElementById('loginbtn');
function loadScript(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>reject(new Error(src+' konnte nicht geladen werden'));document.head.appendChild(s);});}
window.__adminLoginFallback=async function(){msg.textContent='Login wird geprüft…';try{if(!window.BC||!window.BC.db)throw new Error('Supabase/App wird noch geladen. Bitte 3 Sekunden warten und erneut klicken.');const {error}=await window.BC.db.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('pw').value});if(error)throw error;const {data:ok,error:ae}=await window.BC.db.rpc('is_baudicht_admin');if(ae)throw ae;if(!ok)throw new Error('Admin-Berechtigung fehlt.');document.getElementById('login').classList.add('hidden');document.getElementById('admin').classList.remove('hidden');document.getElementById('logoutbtn').classList.remove('hidden');await window.BC.load();if(window.__baudichtAdminDraw)window.__baudichtAdminDraw();}catch(e){msg.textContent='Login-Fehler: '+(e.message||e);}};
(async()=>{const cdns=['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2','https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js'];let loaded=false;for(const url of cdns){try{await loadScript(url);if(window.supabase){loaded=true;break;}}catch(e){}}if(!loaded){msg.textContent='Supabase-CDN blockiert. Bitte Netzwerk/VPN/Content-Blocker prüfen.';return;}try{await loadScript('app.js?v=cdnFallback20261126');await loadScript('admin.js?v=cdnFallback20261126');msg.textContent='Bereit. Bitte anmelden.';}catch(e){msg.textContent='Script-Fehler: '+e.message;}})();
})();
</script></body></html>
