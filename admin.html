<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baudicht Cup | Admin</title><link rel="stylesheet" href="style.css?v=teamlogos1"></head><body><header><div class="brand">BAUDICHT <span>CUP</span> · ADMIN</div><p>ORGANISATION & RESULTATE</p></header><main><div id="login"><h2>Admin-Zugang</h2><p>Mit dem eingerichteten Admin-Konto anmelden.</p><input id="email" type="email" placeholder="Admin-E-Mail"><input id="pw" type="password" placeholder="Passwort"><button id="loginbtn" type="button" onclick="if(!window.__adminLoginFallback){document.getElementById('loginmsg').textContent='Login-Skript nicht geladen. Bitte Seite neu laden.';return;}window.__adminLoginFallback()">Einloggen</button><button id="logoutbtn" class="hidden">Abmelden</button><p id="loginmsg"></p></div><div id="admin" class="hidden"><h2>Resultate verwalten</h2><p>Resultate speichern – die Zuschauer-Seite aktualisiert sich live.</p><button id="newfixtures">Zufälligen Spielplan erstellen (4 Spiele pro Team)</button><button id="refresh">Aktualisieren</button><button id="advanceko">KO-Runden manuell aktualisieren</button><button id="resetresults" style="background:#b91c1c;color:white">Turnier-Ergebnisse zurücksetzen</button><div id="adminmatches"></div><hr><h2>Teams bearbeiten</h2><textarea id="teams" rows="8" placeholder="24 Teamnamen, je eine Zeile"></textarea><button id="saveteams">Teams speichern</button><h3>Vereinslogos hochladen</h3><p>Pro Mannschaft ein Logo (PNG, JPG oder WebP).</p><div id="teamlogo-controls"></div><p id="adminstatus"></p></div></main><script src="config.js?v=20261126koFix1"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(function(){
  window.__drawFallbackMatches=function(){
    const el=document.getElementById('adminmatches');const B=window.BC;if(!el||!B||!B.data)return;
    const d=B.data;const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
    if(!Array.isArray(d.matches))d.matches=[];
    const saveScore=async(input)=>{const i=+input.dataset.i,side=input.dataset.side;d.matches[i][side]=input.value===''?null:Number(input.value);try{await B.save();const st=document.getElementById('adminstatus');if(st)st.textContent='Resultat gespeichert ✓';}catch(e){const st=document.getElementById('adminstatus');if(st)st.textContent='Speicherfehler: '+e.message;}};
    const matches=d.matches.map((m,i)=>'<div style="display:grid;grid-template-columns:minmax(120px,1fr) 60px 60px minmax(120px,1fr);gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #345"><span>'+esc(typeof m.h==='number'?d.teams[m.h]:m.h)+'</span><input type="number" min="0" data-i="'+i+'" data-side="hs" value="'+(m.hs??'')+'" style="width:60px"><input type="number" min="0" data-i="'+i+'" data-side="as" value="'+(m.as??'')+'" style="width:60px"><span>'+esc(typeof m.a==='number'?d.teams[m.a]:m.a)+'</span></div>').join('');
    el.innerHTML='<h3>Ligaspiele – Resultate</h3><p>Hier die Resultate direkt eintragen.</p>'+matches;
    el.querySelectorAll('input').forEach(x=>x.onchange=()=>saveScore(x));
  };
  window.__standaloneLogoUI=function(){
    const root=document.getElementById('teamlogo-controls');if(!root)return;
    const client=(window.BC&&window.BC.db)||window.__baudichtLoginClient;
    let teams=(window.BC&&window.BC.data&&window.BC.data.teams)||Array.from({length:24},(_,i)=>'Team '+(i+1));
    let logos=(window.BC&&window.BC.data&&window.BC.data.teamLogos)||Array(24).fill(null);
    const ta=document.getElementById('teams');if(ta&&!ta.value)ta.value=teams.join('\\n');
    root.innerHTML=teams.map((name,i)=>'<div style="display:flex;align-items:center;gap:12px;margin:10px 0;flex-wrap:wrap"><strong style="min-width:180px">'+(i+1)+'. '+String(name).replace(/[&<>]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[s]))+'</strong>'+(logos[i]?'<img src="'+logos[i]+'" style="width:45px;height:45px;object-fit:contain">':'')+'<input type="file" accept="image/png,image/jpeg,image/webp" data-logo="'+i+'"></div>').join('');
    root.querySelectorAll('input[type=file]').forEach(inp=>inp.onchange=async()=>{let file=inp.files&&inp.files[0];if(!file)return;let msg=document.getElementById('adminstatus');if(file.size>2*1024*1024){if(msg)msg.textContent='Logo zu gross (max. 2 MB)';return;}try{if(!client)throw Error('Supabase-Verbindung fehlt');if(msg)msg.textContent='Logo wird hochgeladen…';let idx=+inp.dataset.logo,path='team-'+(idx+1)+'-'+Date.now()+'.'+(file.name.split('.').pop()||'png');let {error}=await client.storage.from('team-logos').upload(path,file,{upsert:true,contentType:file.type});if(error)throw error;let pub=client.storage.from('team-logos').getPublicUrl(path).data.publicUrl;if(window.BC&&window.BC.data){window.BC.data.teamLogos=window.BC.data.teamLogos||Array(24).fill(null);window.BC.data.teamLogos[idx]=pub;await window.BC.save();}if(msg)msg.textContent='Logo gespeichert ✓';window.__standaloneLogoUI();}catch(e){if(msg)msg.textContent='Uploadfehler: '+e.message;}});
  };
  window.__adminLoginFallback=async function(){
    const msg=document.getElementById('loginmsg'),em=document.getElementById('email'),pw=document.getElementById('pw'),btn=document.getElementById('loginbtn');
    if(btn)btn.disabled=true;
    try{
      if(msg)msg.textContent='Verbindung wird geprüft…';
      const cfg=window.BAUDICHT_CONFIG||{};
      if(!window.supabase||!cfg.SUPABASE_URL||!cfg.SUPABASE_ANON_KEY)throw new Error('Supabase-Skript oder Konfiguration nicht geladen. Seite mit Cmd+Shift+R neu laden.');
      const db=(window.BC&&window.BC.db)||window.__baudichtLoginClient||(window.__baudichtLoginClient=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY));
      if(!em.value.trim()||!pw.value)throw new Error('E-Mail und Passwort eingeben.');
      const {error}=await db.auth.signInWithPassword({email:em.value.trim(),password:pw.value});if(error)throw error;
      const {data:ok,error:ae}=await db.rpc('is_baudicht_admin');if(ae)throw ae;if(!ok)throw new Error('Dieses Konto ist nicht als Turnier-Admin freigeschaltet.');
      if(window.BC&&window.BC.db){document.getElementById('login').classList.add('hidden');document.getElementById('admin').classList.remove('hidden');document.getElementById('logoutbtn').classList.remove('hidden');if(msg)msg.textContent='';if(msg)msg.textContent='';if(window.__baudichtAdminDraw)window.__baudichtAdminDraw();window.__standaloneLogoUI();window.__drawFallbackMatches();try{await Promise.race([window.BC.load(),new Promise((_,reject)=>setTimeout(()=>reject(new Error('Datenbank-Laden dauert zu lange')),12000))]);if(window.__baudichtAdminDraw)window.__baudichtAdminDraw();window.__standaloneLogoUI();window.__drawFallbackMatches();}catch(loadErr){if(msg)msg.textContent='Admin geöffnet; Daten laden fehlgeschlagen: '+loadErr.message;if(window.__baudichtAdminDraw)window.__baudichtAdminDraw();}}
      else {document.getElementById('login').classList.add('hidden');document.getElementById('admin').classList.remove('hidden');msg.textContent='Angemeldet. Admin-Skript fehlt – Funktionen können noch nicht geladen sein.';}
    }catch(e){if(msg)msg.textContent='Login-Fehler: '+(e.message||String(e));}
    finally{if(btn)btn.disabled=false;}
  };
  const b=document.getElementById('loginbtn');if(b)b.onclick=window.__adminLoginFallback;
})();
</script><script src="app.js?v=teamlogos5"></script><script src="admin.js?v=loginfix13"></script></body></html>
